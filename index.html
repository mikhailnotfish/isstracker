<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISS Current Location</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<header class="header">

    <p class="status">
        ● LIVE TELEMETRY
    </p>

    <h1>ISS Current Location</h1>

    <div class="update-time">
        Next update in <span id="countdown-label">5s</span>
    </div>

</header>

<div id="error-banner" class="error-banner">
    Unable to retrieve live telemetry.
</div>

<main class="dashboard">

    <section class="primary-panel">

        <div class="label">Current Position</div>

        <div class="location" id="location-text">
            Fetching...
        </div>

    </section>

    <section class="data-grid">

        <article class="data-card">
            <div class="label">Latitude</div>
            <div class="value" id="lat">—</div>
            <div class="unit">Degrees</div>
        </article>

        <article class="data-card">
            <div class="label">Longitude</div>
            <div class="value" id="lon">—</div>
            <div class="unit">Degrees</div>
        </article>

        <article class="data-card">
            <div class="label">Altitude</div>
            <div class="value" id="alt">408</div>
            <div class="unit">km</div>
        </article>

        <article class="data-card">
            <div class="label">Velocity</div>
            <div class="value" id="vel">27,600</div>
            <div class="unit">km/h</div>
        </article>

    </section>

</main>

<footer>

    Data provided by
    <a href="https://wheretheiss.at" target="_blank" rel="noopener">wheretheiss.at</a>
    ·
    Reverse geocoding by
    <a href="https://bigdatacloud.com" target="_blank" rel="noopener">BigDataCloud</a>

</footer>

<script src="script.js"></script>

</body>
</html>
